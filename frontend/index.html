<!DOCTYPE html>
<html>
<head>
  <title>Coffee Inventory</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      padding: 40px;
    }
    h1 {
      color: #333;
    }
    .item {
      background: white;
      padding: 10px;
      margin: 8px 0;
      border-radius: 6px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <h1>☕ Coffee Inventory</h1>
  <div id="list">Loading...</div>

  <script>
    const API_URL = "https://s06w0x0m28.execute-api.us-east-2.amazonaws.com/prod/coffee";

    async function loadCoffee() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();

        const list = document.getElementById("list");
        list.innerHTML = "";

        data.forEach(item => {
          const div = document.createElement("div");
          div.className = "item";
          div.innerText = `${item.name} - ${item.quantity}`;
          list.appendChild(div);
        });
      } catch (err) {
        document.getElementById("list").innerText = "Error loading data.";
        console.error(err);
      }
    }

    loadCoffee();
  </script>
</body>
</html>
